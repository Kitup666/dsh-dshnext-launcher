[package]
name = "dshnext"
version = "0.1.0"
edition = "2024"
description = "DshDesk — DeepSeek Harness 启动器（原生 Rust 重写，iced 0.14）"

# feature 清单与 DESIGN.md §2 一致，与 phase0 探针保持同一组开关，
# 否则阶段 0 的性能结论不适用。
[dependencies]
iced = { version = "0.14", default-features = false, features = [
    "wgpu",
    "tiny-skia",
    "crisp",
    "advanced-shaping",
    "advanced",
    "canvas",
    "svg",
    "image",
    "tokio",
    "thread-pool",
] }
png = "0.17"
env_logger = "0.11"
log = "0.4"
# 玻璃 shader 管线（src/ui/glass_pipeline.rs）：iced 官方自定义 primitive 通路，
# 版本必须与 iced 内部一致（0.14 互相锁死）。wgpu 本体走 iced::wgpu 再导出。
iced_wgpu = "0.14"
iced_renderer = "0.14"
bytemuck = { version = "1.0", features = ["derive"] }

# ---- 后端（src/core/，版本与上一代 docs/Cargo.toml.tauri-reference 对齐）----
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "stream",
] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros", "rt"] }
dirs = "5"
futures-util = "0.3"
# 替代 tauri-plugin-opener：打开系统浏览器与文件管理器（DESIGN.md §5）
open = "5"

[profile.release]
opt-level = 3
# 阶段 4 实测修正：在 codegen-units=1 前提下，lto 对体积几乎无益——
# false 出 17.10 MB、fat 出 17.35 MB（fat 反而大 0.25 MB，因为整 crate 单
# 编译单元时跨单元内联本就没多少可做，激进内联还撑大代码），而 fat 把全量
# release 构建从 27s 拖到 5min。首帧耗时与 lto 无关（阶段 4 排查过）。
# 故定 lto=false：更小、构建快 10 倍，无运行时代价。
lto = false
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
iced_test = "0.14.0"

[build-dependencies]
winresource = "0.1"
