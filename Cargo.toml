[workspace]
members = ["webui"]

[workspace.package]
version = "0.1.14"
edition = "2024"

[package]
name = "dshnext"
version.workspace = true
edition.workspace = true
description = "DshDesk — DeepSeek Harness 启动器（原生 Rust 重写，iced 0.14）"

# feature 清单与 DESIGN.md §2 一致，与 phase0 探针保持同一组开关，
# 否则阶段 0 的性能结论不适用。
[dependencies]
iced = { version = "0.14", default-features = false, features = [
    "wgpu",
    "tiny-skia",
    "crisp",
    "advanced-shaping",
    "advanced",
    "canvas",
    "svg",
    "image",
    "tokio",
    "thread-pool",
] }
png = "0.17"
env_logger = "0.11"
log = "0.4"
# 玻璃 shader 管线（src/ui/glass_pipeline.rs）：iced 官方自定义 primitive 通路，
# 版本必须与 iced 内部一致（0.14 互相锁死）。wgpu 本体走 iced::wgpu 再导出。
iced_wgpu = "0.14"
iced_renderer = "0.14"
bytemuck = { version = "1.0", features = ["derive"] }

# 系统托盘（src/tray.rs）：tauri 系 crate，Windows 上用 winit 主线程的消息泵，
# 事件走全局 channel（Subscription 轮询，同 bridge.rs 模式）。静态链不破零依赖。
tray-icon = "0.24"

# ---- 后端（src/core/，版本与上一代 docs/Cargo.toml.tauri-reference 对齐）----
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "stream",
] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros", "rt"] }
dirs = "5"
futures-util = "0.3"
# 替代 tauri-plugin-opener：打开系统浏览器与文件管理器（DESIGN.md §5）
open = "5"
# 桌面窗口模式：WebView2 独立窗口。wry 封装 webview2-com；窗口用 windows crate
# 手写原生 Win32（不能用 tao——tao 是 winit 分支，与 iced 主线程的 winit 在同进程
# 抢全局状态会崩）。raw-window-handle 把我们的 HWND 适配给 wry。
# 运行时依赖不破：WebView2Loader 由系统 Edge 提供，不打包内核。
wry = "0.57"
raw-window-handle = "0.6"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
] }
# 首次启动引导的目录选择（Windows 走 IFileDialog，阻塞 API 在 spawn_blocking
# 里调）。零运行时依赖不破：rfd 静态进 exe。
rfd = "0.15"
# 目录迁移里的 junction 重建（npm 依赖树全是 junction；std 没有稳定的
# junction API，symlink_dir 又要特权）。Windows-only 小 crate。
junction = "1.2"

[profile.release]
opt-level = 3
# 阶段 4 实测修正：在 codegen-units=1 前提下，lto 对体积几乎无益——
# false 出 17.10 MB、fat 出 17.35 MB（fat 反而大 0.25 MB，因为整 crate 单
# 编译单元时跨单元内联本就没多少可做，激进内联还撑大代码），而 fat 把全量
# release 构建从 27s 拖到 5min。首帧耗时与 lto 无关（阶段 4 排查过）。
# 故定 lto=false：更小、构建快 10 倍，无运行时代价。
lto = false
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
iced_test = "0.14.0"

[build-dependencies]
winresource = "0.1"
